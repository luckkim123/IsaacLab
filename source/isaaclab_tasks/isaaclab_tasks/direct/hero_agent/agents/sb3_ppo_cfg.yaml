# Stable Baselines3 PPO configuration for Hero Agent ALBC.
# Hyperparameters aligned with RSL-RL configuration for consistency.

seed: 42

n_timesteps: !!float 1.2e7  # 600 iterations * 32 steps * 4096 envs (approx)
policy: 'MlpPolicy'
n_steps: 32
batch_size: 4096
gae_lambda: 0.95
gamma: 0.99
n_epochs: 8
ent_coef: 0.0
learning_rate: !!float 3e-4
clip_range: !!float 0.2
policy_kwargs:
  activation_fn: 'nn.ELU'
  net_arch: [64, 64]
  squash_output: False
vf_coef: 1.0
max_grad_norm: 1.0
normalize_advantage: True
device: "cuda:0"
